# Cloudflare Pages configuration. Safe to commit: it holds IDs, not secrets.
# Once this file exists, it controls the project's bindings (the dashboard only shows them).
#
# LeaderFlow Cloudflare account ID: 81dece9b7fa126f4d6a9f06b07e08375
# Your login can see more than one account, so point Wrangler at LeaderFlow's before remote commands:
#   PowerShell:  $env:CLOUDFLARE_ACCOUNT_ID = "81dece9b7fa126f4d6a9f06b07e08375"
#   Git Bash:    export CLOUDFLARE_ACCOUNT_ID=81dece9b7fa126f4d6a9f06b07e08375

name = "leaderflow"                  # must match the Pages project name when it is created
pages_build_output_dir = "site"
compatibility_date = "2026-11-01"

# Production: real submissions. Code reaches it as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "leaderflow-forms"
database_id = "c1458b54-a97a-4bd0-9410-8147a7ba04b0"
migrations_dir = "migrations"

# R2 résumé storage: waiting on the payment-card decision. Uncomment once the bucket exists.
# [[r2_buckets]]
# binding = "RESUMES"
# bucket_name = "leaderflow-resumes"

# Preview deployments (every branch and pull request): test submissions only.
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "leaderflow-forms-preview"
database_id = "9e20bed4-15df-4eae-b868-8971a73de887"
migrations_dir = "migrations"
